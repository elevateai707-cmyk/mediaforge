services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ignite
      POSTGRES_PASSWORD: ignite
      POSTGRES_DB: ignitemerch
    ports:
      - "5435:5432"
    volumes:
      - ignite_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ignite -d ignitemerch"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  ignite_pg:
