# FACTS: the ONLY claims an ad for this site may make (zero fabrication, enforced in code).
# A fact counts only when it has an exact `statement` AND `verified: true`.
# `source` = where the proof lives (licence #, price page, invoice). `expires` = date for
# prices/promos/rebates (expired facts stop being usable). Add keys freely: snake_case.
# Need a fact that isn't here? AdLab flags it in the brief's `missing_facts` instead of
# inventing it. No testimonials, review counts, star ratings, stats or "as seen on"
# unless you can prove them and add them here.
facts:
  red_seal_master_electrician:
    statement: "Installed by a Red Seal Master Electrician"
    verified: false          # confirm wording, then put your certificate # in source
    source: ""
  licensed_and_insured:
    statement: ""
    verified: false
    source: ""
  service_area:
    statement: ""            # e.g. "Serving Calgary and area"
    verified: false
  permits_and_inspection:
    statement: ""            # only if you pull permits on every job
    verified: false
  charger_brands:
    statement: ""            # brands you install
    verified: false
  install_price_from:
    statement: ""            # e.g. "Level 2 installs from $X CAD"
    verified: false
    expires: null
  workmanship_warranty:
    statement: ""            # exact terms
    verified: false
  rebate_info:
    statement: ""            # rebates change often: always set expires
    verified: false
    source: ""
    expires: null
