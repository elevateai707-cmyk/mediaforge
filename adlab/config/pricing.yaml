# USD per 1M tokens, used by the per-command cost ledger (data/logs/usage.jsonl).
# Anthropic first-party API list prices as of 2026-10-06. Check
# https://platform.claude.com/docs/en/about-claude/pricing and update when they change.
# cache_write = 5-minute cache write (~1.25x input per Anthropic's docs). Leave a price null
# when you don't know it: calls that need it are logged as "unpriced", never guessed.
# Local models cost 0.
models:
  claude-opus-5-5:        # default: teardown vision + brief writing
    input: 4.00
    output: 20.00
    cache_read: 0.20
    cache_write: 5.00
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_read: 0.20
    cache_write: 2.50
  claude-haiku-5-5:       # prices for prompts up to 100K tokens
    input: 0.10
    output: 0.50
    cache_read: null      # not in the reference I checked: fill from the pricing page
    cache_write: null
  hermes-local:           # local Hermes LLM: no per-token cost
    input: 0
    output: 0
    cache_read: 0
    cache_write: 0
# Non-token services, priced per unit when Phase 5 calls them (fill from your plan).
services:
  elevenlabs_per_1k_chars: null
