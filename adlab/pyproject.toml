[project]
name = "adlab"
version = "0.1.0"
description = "Agentic ad research -> teardown -> remake, local-first, built on Media Forge."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "typer>=0.12",
  "httpx>=0.27",
  "python-dotenv>=1",
  "chromadb>=0.5",
  "apscheduler>=3.10,<4",
  "pillow>=10",
  "anthropic>=1.13",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pglast>=6"]
whisper = ["faster-whisper>=1.0"]   # local transcription worker (GPU optional)

[project.scripts]
adlab = "adlab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["adlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
