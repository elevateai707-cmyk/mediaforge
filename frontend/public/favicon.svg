<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MediaForge">
  <defs>
    <linearGradient id="mf-beam" x1="64" y1="448" x2="448" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8a317"/>
      <stop offset="55%" stop-color="#f3ead8"/>
      <stop offset="100%" stop-color="#4ebdb8"/>
    </linearGradient>
    <linearGradient id="mf-face" x1="160" y1="200" x2="360" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a231c"/>
      <stop offset="100%" stop-color="#161310"/>
    </linearGradient>
    <filter id="mf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="114" fill="#14110e"/>
  <rect x="18" y="18" width="476" height="476" rx="98" fill="none" stroke="url(#mf-beam)" stroke-width="6" opacity="0.9"/>
  <!-- clapper stick -->
  <g filter="url(#mf-glow)">
    <path d="M118 168 L394 118 L410 168 L134 218 Z" fill="url(#mf-beam)"/>
    <path d="M150 162 L186 154 L194 186 L158 194 Z" fill="#100e0c" opacity="0.55"/>
    <path d="M230 146 L266 138 L274 170 L238 178 Z" fill="#100e0c" opacity="0.55"/>
    <path d="M310 130 L346 122 L354 154 L318 162 Z" fill="#100e0c" opacity="0.55"/>
  </g>
  <!-- body -->
  <rect x="128" y="210" width="256" height="196" rx="22" fill="url(#mf-face)" stroke="url(#mf-beam)" stroke-width="5"/>
  <path d="M210 268 L322 324 L210 380 Z" fill="url(#mf-beam)"/>
  <circle cx="392" cy="132" r="10" fill="#4ebdb8"/>
  <circle cx="412" cy="154" r="5" fill="#e8a317"/>
</svg>
